<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0C0B0A"/>

  <!-- thin champagne frame, inset -->
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#BE9A5D" stroke-width="1.5" opacity="0.6"/>

  <!-- large profile hairline on the right third + the one permitted round element -->
  <g transform="translate(770,55) scale(1.32)">
    <path d="M108 28 C138 36 152 58 149 84 C147.5 93 143 98 144.5 104 C162 126 170 142 166 154 C164 162 153 164 150 167 C157 172 157 179 151 183 C158 188 157 196 149 201 C159 208 157 224 144 235 C131 247 110 253 90 254"
          fill="none" stroke="#BE9A5D" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="52" cy="238" r="6" fill="#BE9A5D"/>
  </g>

  <!-- Latin wordmark only: librsvg resolves <text> against system fonts, so Korean
       here would silently break in CI. Helvetica/Arial exist everywhere. -->
  <rect x="92" y="176" width="56" height="2" fill="#BE9A5D"/>
  <text x="90" y="286" font-family="Helvetica,Arial,sans-serif" font-size="86"
        font-weight="300" letter-spacing="24" fill="#EFEAE0">CONTOUR</text>
  <text x="90" y="378" font-family="Helvetica,Arial,sans-serif" font-size="86"
        font-weight="300" letter-spacing="24" fill="#BE9A5D">REPORT</text>
  <text x="92" y="452" font-family="Helvetica,Arial,sans-serif" font-size="19"
        font-weight="400" letter-spacing="7" fill="#8A8478">KOREA PLASTIC SURGERY DATA</text>
</svg>
